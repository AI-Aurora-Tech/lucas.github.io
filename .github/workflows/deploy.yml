name: Publicar site

# Publica o portfólio no GitHub Pages a cada push na branch principal.
#
# Antes de publicar, varre as pastas de mídia e regenera a lista de arquivos,
# então basta subir fotos e vídeos que o site passa a exibi-los sozinho.
#
# A lista regenerada também é commitada de volta no repositório. Isso importa
# quando o Pages está configurado como "Deploy from a branch": nesse modo o
# GitHub publica os arquivos do jeito que estão salvos, sem rodar este
# workflow, e o site acabaria servindo uma lista velha.

on:
  push:
    branches:
      - main
      - claude/soccer-player-portfolio-9k2i21
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar lista de fotos e vídeos
        run: node scripts/gerar-midia.js

      - name: Salvar a lista no repositório
        run: |
          if git diff --quiet -- assets/media.js assets/media.json; then
            echo "A lista já estava em dia — nada a commitar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/media.js assets/media.json
            git commit -m "Atualiza a lista de fotos e vídeos"
            # Se a organização deixar os workflows sem permissão de escrita, o
            # push falha — mas a publicação abaixo já usa a lista recém-gerada,
            # então só avisamos em vez de derrubar o job.
            git push || echo "Aviso: não foi possível salvar a lista no repositório."
          fi

      - name: Evitar processamento Jekyll
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
