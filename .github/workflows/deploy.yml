name: Publicar site

# Publica o portfólio no GitHub Pages a cada push na branch principal.
# Antes de publicar, varre as pastas de mídia e regenera assets/media.js,
# então basta subir fotos e vídeos que o site passa a exibi-los sozinho.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar lista de fotos e vídeos
        run: node scripts/gerar-midia.js

      - name: Evitar processamento Jekyll
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
